<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Style Album Player</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="spotify-app">
      <aside class="sidebar">
        <div class="brand-logo">Spotify</div>

        <nav class="nav-menu" aria-label="Main navigation">
          <button class="nav-item active" type="button">Home</button>
          <button class="nav-item" type="button">Search</button>
          <button class="nav-item" type="button">Your Library</button>
        </nav>

        <div class="library-box">
          <div class="library-title">Album</div>
          <div class="library-meta">30 tracks</div>
        </div>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <div class="nav-arrows">
            <button type="button" aria-label="Back">←</button>
            <button type="button" aria-label="Forward">→</button>
          </div>
          <div class="user-pill">HVL Album</div>
        </header>

        <main class="content-area">
          <section class="hero-panel">
            <div class="hero-cover" aria-hidden="true">♪</div>
            <div class="hero-text">
              <span class="mini-label">Playlist</span>
              <h1>HVL Album</h1>
              <p>30 bài hát • Local album player</p>
            </div>
          </section>

          <section class="player-panel">
            <div class="controls-row">
              <button id="shuffleBtn" class="control-btn" type="button" aria-label="Shuffle" title="Shuffle">
                <span>⇄</span>
              </button>
              <button id="prevBtn" class="control-btn nav-btn" type="button" aria-label="Previous" title="Previous">⏮</button>
              <button id="playPauseBtn" class="play-btn" type="button" aria-label="Play or pause" title="Play/Pause">▶</button>
              <button id="nextBtn" class="control-btn nav-btn" type="button" aria-label="Next" title="Next">⏭</button>
              <button id="repeatBtn" class="control-btn" type="button" aria-label="Repeat" title="Repeat">
                <span id="repeatIcon">↻</span>
              </button>
            </div>

            <div class="track-meta">
              <p class="track-label">Đang phát</p>
              <h2 id="nowPlayingTitle">Elegie</h2>
            </div>

            <div class="progress-wrap">
              <div class="time-row">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
              </div>
              <input id="progressBar" type="range" min="0" max="100" value="0" aria-label="Seek" />
            </div>

            <div class="volume-row">
              <span class="volume-icon" aria-hidden="true">🔊</span>
              <input id="volumeBar" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume" />
            </div>
          </section>

          <aside class="playlist-panel">
            <div class="playlist-header">
              <h3>Playlist</h3>
              <span id="trackCount">30 bài</span>
            </div>
            <ul id="playlist" class="playlist" aria-label="Album playlist"></ul>
          </aside>
        </main>
      </div>
    </div>

    <audio id="audio" preload="metadata"></audio>

    <script src="script.js"></script>
  </body>
</html>
